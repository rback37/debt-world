name: Translation review / 翻译校对
description: Suggest respectful wording without exposing any user's data.
title: "[Translation] "
labels: ["translation", "needs-review"]
body:
  - type: input
    id: language
    attributes:
      label: Language and region / 语言与地区
      placeholder: "Example: Spanish (Mexico)"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Current text / 当前文字
    validations:
      required: true
  - type: input
    id: proposed
    attributes:
      label: Proposed text / 建议文字
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this clearer or more respectful? / 为什么更清楚或更尊重
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Confirmation / 确认
      options:
        - label: This suggestion contains no real user story or financial data. / 建议中不包含真实用户故事或财务数据。
          required: true
